[package]
name = "livipen-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Livi Pen tool state machines: pointer events in, commands and overlays out"

[lints]
workspace = true

[dependencies]
livipen-geom = { workspace = true }
livipen-color = { workspace = true }
livipen-doc = { workspace = true }
livipen-pathops = { workspace = true }
livipen-effects = { workspace = true }
livipen-text = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
livipen-text = { workspace = true, features = ["test-fonts", "bundled-fonts"] }
