[package]
name = "livipen-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Livi Pen egui frontend (menus, panels, tools and canvas); swappable — nothing below depends on it"

[lints]
workspace = true

[features]
default = ["bundled-fonts", "interface-fonts"]
# The fonts livipen-text bundles for documents, through the engine's `bundled-fonts`. Off, for
# an embedder that supplies every document font at run time (`livipen_text::FontDb::add_font`);
# the interface's own faces are `interface-fonts`.
bundled-fonts = ["livipen-engine/bundled-fonts"]
# The interface's own faces (theme.rs: Inter, Source Sans 3, JetBrains Mono, about 2 MB). Off, the
# panels and dialogs draw in egui's built-in fonts, which lack some symbols they show (→ ▾ ● ✓);
# `theme::install_fonts` binds their families either way.
interface-fonts = []

[dependencies]
craft-ui = { workspace = true }
livipen-geom = { workspace = true }
livipen-color = { workspace = true }
livipen-doc = { workspace = true }
livipen-brush = { workspace = true }
livipen-render = { workspace = true }
livipen-text = { workspace = true }
livipen-tools = { workspace = true }
livipen-engine = { workspace = true }
livipen-svg = { workspace = true }
livipen-effects = { workspace = true }
livipen-three-d = { workspace = true }
livipen-plugins = { workspace = true }
livipen-pdf = { workspace = true }
livipen-cad = { workspace = true }
livipen-eps = { workspace = true }
livipen-format = { workspace = true }
egui = { workspace = true, features = ["bytemuck"] }
# With egui's `bytemuck`: copies rendered rasters into egui images whole (`canvas::color_image`).
bytemuck = "1"
egui_extras = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `now_ms` (src/lib.rs) reads the page's `performance.now()` with this crate in the web build. It is
# MIT OR Apache-2.0 and already in the build through eframe.
web-time = "1"

# The current user's id (`geteuid`): Preview in Browser uses its temporary folder only when that
# user owns it (src/dialogs/save_for_web.rs). Already in Cargo.lock (tempfile), so this adds no
# new crate.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
livipen-testkit = { workspace = true }
# A variable font built in code (no font file is committed).
livipen-text = { workspace = true, features = ["test-fonts"] }
wat = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
