[package]
name = "livipen-cad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Livi Pen CAD interchange: a hand-written ASCII DXF writer (R12 to 2018)"

[lints]
workspace = true

[dependencies]
livipen-geom = { workspace = true }
livipen-color = { workspace = true }
livipen-doc = { workspace = true }
livipen-effects = { workspace = true }
livipen-brush = { workspace = true }
livipen-pathops = { workspace = true }
livipen-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
livipen-text = { workspace = true, features = ["bundled-fonts"] }
