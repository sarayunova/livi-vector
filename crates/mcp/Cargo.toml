[package]
name = "livipen-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Livi Pen MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# The fonts livipen-text bundles for documents, through the engine's `bundled-fonts`, as
# livipen-ui-egui's. Off, for an embedder that supplies every document font at run time.
bundled-fonts = ["livipen-engine/bundled-fonts"]

[dependencies]
livipen-engine = { workspace = true }
livipen-render = { workspace = true }
livipen-svg = { workspace = true }
livipen-format = { workspace = true }
livipen-tools = { workspace = true }
livipen-geom = { workspace = true }
livipen-doc = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

image = { workspace = true }

[dev-dependencies]
livipen-testkit = { workspace = true }
proptest = { workspace = true }
socket2 = { workspace = true }
