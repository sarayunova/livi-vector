[package]
name = "livipen-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Livi Pen engine: sessions, history, selection, the command registry"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# The fonts livipen-text bundles (see its `bundled-fonts`). Embedders that supply every font at
# run time (`livipen_text::FontDb::add_font`) build with `default-features = false`.
bundled-fonts = ["livipen-text/bundled-fonts"]

[dependencies]
# Which paths stored in documents may be opened.
craft-docpath = { workspace = true }
livipen-geom = { workspace = true }
livipen-color = { workspace = true }
livipen-doc = { workspace = true }
livipen-tools = { workspace = true }
livipen-text = { workspace = true }
livipen-render = { workspace = true }
livipen-pathops = { workspace = true }
livipen-brush = { workspace = true }
livipen-trace = { workspace = true }
livipen-svg = { workspace = true }
livipen-format = { workspace = true }
livipen-pdf = { workspace = true }
livipen-cad = { workspace = true }
livipen-eps = { workspace = true }
livipen-metafile = { workspace = true }
livipen-plugins = { workspace = true }
livipen-affinity = { workspace = true }
livipen-scriptcheck = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
# The XML parts of Word documents placed as type (place/docx.rs).
roxmltree = "0.21"
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Whether a recovery area folder is this account's own (`FolderStore::own_area`). Already in
# Cargo.lock (tempfile, ui-egui), so this adds no new crate.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"] }

[dev-dependencies]
livipen-affinity = { workspace = true, features = ["synth"] }
crc32fast = { workspace = true }
livipen-testkit = { workspace = true }
proptest = { workspace = true }
# A variable font built in code (no font file is committed).
livipen-text = { workspace = true, features = ["test-fonts"] }
wat = { workspace = true }
# Zstandard streams for the Illustrator editing data fuzz tests.
ruzstd = { workspace = true }
