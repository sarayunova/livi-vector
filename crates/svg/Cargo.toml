[package]
name = "livipen-svg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Livi Pen SVG import and export"

[lints]
workspace = true

[dependencies]
# Which paths stored in documents may be opened.
craft-docpath = { workspace = true }
livipen-geom = { workspace = true }
livipen-color = { workspace = true }
livipen-doc = { workspace = true }
livipen-effects = { workspace = true }
livipen-brush = { workspace = true }
livipen-text = { workspace = true }
kurbo = { workspace = true }
usvg = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# Live effect params read from filters.
serde_json = { workspace = true }
# SVGZ (gzip, pure-Rust backend: builds for wasm).
flate2 = { workspace = true }
image = { workspace = true }
# Colour / transform / length parsing for the <text> fallback (MIT OR Apache-2.0; already used by usvg).
svgtypes = "0.16"

[dev-dependencies]
# Reading embedded font subsets back.
skrifa = { workspace = true }
# A variable font built in code (no font file is committed).
livipen-text = { workspace = true, features = ["test-fonts"] }
resvg = { version = "0.48", default-features = false }
# usvg as a reference viewer that lays text out in a font (text_layout.rs).
usvg = { workspace = true, features = ["text"] }
livipen-testkit = { workspace = true }
proptest = { workspace = true }
image = { workspace = true }
